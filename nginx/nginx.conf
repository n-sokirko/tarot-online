# ---- Rate limiting / anti-abuse (http context) ----
# General API traffic: generous, smooths spikes. Auth: strict, blocks brute force.
limit_req_zone  $binary_remote_addr  zone=api_limit:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=auth_limit:10m  rate=12r/m;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS — re-resolve service names every 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;            # don't leak nginx version
    client_max_body_size 20M;
    limit_conn conn_limit 50;     # max concurrent connections per IP

    # ---- Security headers (inherited by locations without their own add_header) ----
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Django static files (output of collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Auth endpoints — strict rate limit (brute-force protection)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=8 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;   # AI generations can take 30–90s
    }

    # Django REST API — general rate limit
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;   # AI generations can take 30–90s
        # Stream Server-Sent Events through immediately (live AI typing).
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # Django admin panel — strict rate limit (login brute-force)
    location /admin/ {
        limit_req zone=auth_limit burst=8 nodelay;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Next.js hashed build assets — content-addressed, cache forever.
    location /_next/static/ {
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static images from Next.js /public (card art, icons, etc.)
    location /cards/ {
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=604800";
    }

    # Next.js app (everything else)
    location / {
        limit_req zone=api_limit burst=40 nodelay;
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support (Next.js HMR / Server-Sent Events)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_cache_bypass                 $http_upgrade;
    }
}
